<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>JS-Bildgalerie</title>
</head>

<body>

    <nav>
        <h1>JS-Bildgalerie</h1>
    </nav>

    <!-- The Modal -->
    <div id="myModal" class="modal">

        <!-- Modal content -->
        <div class="modal-content">
            <span class="close">&times;</span>
            <h1>Enter here your URL</h1>
            <input size="100" type="text" id="imgURL" name="imgURL">
            <button onclick="addImage()">Lets go!</button>
        </div>
    </div>

    <div id="container">
        <div id="imageGallery">

        </div>
        <img src="images/addImage.png" id="myBtn" alt="">
    </div>

    <script src="script.js"></script>

</body>

</html>
